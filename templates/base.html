<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Explorateur ORCID{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:       #0f1117;
            --ink-soft:  #4a4f5e;
            --ink-muted: #8a8f9e;
            --paper:     #faf9f6;
            --paper-2:   #f2f0ea;
            --paper-3:   #e8e4da;
            --accent:    #1a6b4a;
            --accent-2:  #c8f0dc;
            --accent-3:  #e4f7ee;
            --warn:      #c0392b;
            --warn-soft: #fdf0ee;
            --border:    #dddad2;
            --radius:    6px;
            --shadow:    0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        header {
            background: var(--ink);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: -.01em;
        }

        .logo span {
            color: var(--accent-2);
        }

        nav { display: flex; gap: .25rem; }

        nav a {
            color: rgba(255,255,255,.65);
            text-decoration: none;
            font-size: .85rem;
            font-weight: 400;
            padding: .45rem .9rem;
            border-radius: var(--radius);
            transition: background .15s, color .15s;
        }

        nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
        nav a.active { background: var(--accent); color: #fff; }

        .env-btn {
            font-family: 'DM Mono', monospace;
            font-size: .7rem;
            padding: .25rem .75rem;
            border-radius: 20px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,.25);
            background: transparent;
            color: rgba(255,255,255,.55);
            cursor: pointer;
            transition: all .15s;
        }
        .env-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
        .env-btn-active {
            border-color: transparent;
            font-weight: 600;
        }

        /* ── Main ── */
        main {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* ── Typography ── */
        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            line-height: 1.15;
            letter-spacing: -.02em;
            margin-bottom: .5rem;
        }

        h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.35rem;
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        h3 {
            font-size: .8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--ink-muted);
            margin-bottom: .75rem;
        }

        p { line-height: 1.65; color: var(--ink-soft); }

        /* ── Cards ── */
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.75rem;
            box-shadow: var(--shadow);
        }

        /* ── Form elements ── */
        .form-group { margin-bottom: 1.25rem; }

        label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: var(--ink-soft);
            margin-bottom: .4rem;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        input[type="text"] {
            width: 100%;
            padding: .65rem .9rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: .95rem;
            font-weight: 300;
            background: var(--paper);
            color: var(--ink);
            transition: border-color .15s, box-shadow .15s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-3);
            background: #fff;
        }

        input[type="text"]::placeholder { color: var(--ink-muted); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .65rem 1.4rem;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover { background: #155a3e; transform: translateY(-1px); }

        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1.5px solid var(--border);
        }

        .btn-ghost:hover { background: var(--paper-2); }

        /* ── Alerts ── */
        .alert {
            padding: .9rem 1.2rem;
            border-radius: var(--radius);
            font-size: .9rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: .75rem;
        }

        .alert-error {
            background: var(--warn-soft);
            border: 1px solid #f5c6c0;
            color: var(--warn);
        }

        .alert-info {
            background: var(--accent-3);
            border: 1px solid var(--accent-2);
            color: var(--accent);
        }

        /* ── Tags ── */
        .tag {
            display: inline-block;
            padding: .2rem .65rem;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 500;
            background: var(--paper-2);
            color: var(--ink-soft);
            border: 1px solid var(--border);
        }

        .tag-green {
            background: var(--accent-3);
            color: var(--accent);
            border-color: var(--accent-2);
        }

        /* ── Mono ── */
        code, .mono {
            font-family: 'DM Mono', monospace;
            font-size: .85em;
            background: var(--paper-2);
            padding: .1em .4em;
            border-radius: 3px;
            color: var(--ink);
        }

        /* ── Footer ── */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: .78rem;
            color: var(--ink-muted);
            border-top: 1px solid var(--border);
        }

        footer a { color: var(--accent); text-decoration: none; }

        /* ── Divider ── */
        hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .fade-up { animation: fadeUp .35s ease both; }
        .fade-up-delay { animation: fadeUp .35s ease .1s both; }
        .fade-up-delay-2 { animation: fadeUp .35s ease .2s both; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    <header>
        <a class="logo" href="/">ORCID <span>Explorer</span></a>
        <nav>
            <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>Accueil</a>
            <a href="/profil" {% if request.endpoint == 'profil' %}class="active"{% endif %}>Profil</a>
            <a href="/recherche" {% if request.endpoint == 'recherche' %}class="active"{% endif %}>Recherche</a>
        </nav>
        <form action="/set-env" method="POST" style="display:flex; align-items:center; gap:.4rem;">
            {% for key, info in environments.items() %}
            <button
                type="submit"
                name="env"
                value="{{ key }}"
                class="env-btn {% if current_env == key %}env-btn-active{% endif %}"
                {% if current_env == key %}style="background:{{ info.color }}; color:{{ info.text_color }}; border-color:transparent;"{% endif %}
            >{{ info.label }}</button>
            {% endfor %}
        </form>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        ORCID Explorer · Sandbox &nbsp;·&nbsp;
        API : <a href="https://pub.sandbox.orcid.org/v3.0" target="_blank">pub.sandbox.orcid.org/v3.0</a>
        &nbsp;·&nbsp;
        <a href="https://info.orcid.org/documentation/api-tutorials/" target="_blank">Documentation ORCID</a>
    </footer>
</body>
</html>
